# Netlify: build the Vite app and publish dist/
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Art, sounds, fonts and clips never change between deploys of the same file name: cache them for a week.
# (The JS/CSS bundles in /assets have content hashes, so they can be cached for a year.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/world/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sfx/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
